# Demo caps and limits for the Cloud Run service (env vars, applied by deploy/deploy.sh with --env-vars-file).
# The Gemini/Vertex settings, IRIS_PUBLIC_URL and the optional storage paths are added by deploy.sh. Secrets never go
# here: they come from Secret Manager. A changed value takes effect in the next revision, so it means a redeploy.
# Every variable is documented in docs/architecture/15-requirements-settings-and-config.md.
IRIS_PROPOSE_PER_HOUR: "20"        # proposals per visitor per hour; a plan costs one per clash pair
IRIS_PROPOSE_PER_DAY: "300"        # proposals for everyone per day
IRIS_TRUST_FORWARDED: "1"          # Cloud Run's front end appends the visitor's address to X-Forwarded-For (limits.client_id)
IRIS_MAX_SCENES: "8"               # open model sets kept in memory
IRIS_MAX_REPORTS: "8"              # open clash reports (uploads are deleted when dropped)
IRIS_UPLOAD_MAX_MB: "150"          # a clash report upload, all files
IRIS_ESCALATE_PER_HOUR: "3"        # second tries on the escalation model per visitor (each also a proposal)
IRIS_ESCALATE_PER_DAY: "30"        # for everyone
IRIS_ESCALATION_MAX_USD_DAY: "25"  # what the escalation model may cost in a day, all visitors (spend.py)
IRIS_BUILT_VIEWS: "0"              # Show it built off unless the owner switches it on (settings.py)
IRIS_BUILT_PER_HOUR: "6"           # built views per visitor
IRIS_BUILT_PER_DAY: "60"           # for everyone
IRIS_CHAT_PER_HOUR: "40"           # chat messages per visitor
IRIS_CHAT_PER_DAY: "1500"
IRIS_VOICE_PER_HOUR: "60"          # spoken messages per visitor
IRIS_VOICE_PER_DAY: "2000"
IRIS_MODEL_UPLOAD_MAX_MB: "150"    # a visitor's own models, all files, unpacked (docs/uploads.md)
IRIS_SCENE_BUDGET_MB: "300"        # open models' IFC bytes held: two of the biggest, about 2.5 GB of the 4 GiB
IRIS_MODEL_UPLOADS_PER_HOUR: "10"  # visitors' own models (IFC or STEP), per visitor
IRIS_MODEL_UPLOADS_PER_DAY: "200"  # for everyone
IRIS_LINKS_PER_HOUR: "10"          # agent links (MCP) a visitor can make
IRIS_LINKS_PER_DAY: "500"          # for everyone
IRIS_AGENT_CALLS_PER_HOUR: "600"   # MCP tool calls per link (fixes are also charged as proposals)
IRIS_OPEN_WEIGHTS: "0"             # the open-weights triage model stays off unless the owner switches it on
