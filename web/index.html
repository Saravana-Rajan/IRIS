<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Iris · AI design coordination</title>
    <meta name="description" content="Iris finds where 3D models clash, proposes fixes that edit the real elements, and checks every fix with geometry." />
    <meta property="og:title" content="Iris — Does AI truly see?" />
    <meta property="og:image" content="/brand/og.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="mask-icon" href="/brand/safari-pinned-tab.svg" color="#052640" />
    <link rel="manifest" href="/brand/site.webmanifest" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap" />
    <style>
      /* Shown until React mounts (it replaces #root's children): the mark and the wordmark's letters arrive once. */
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #fff; color: #11161b; font: 13px "IBM Plex Sans", system-ui, sans-serif; }
      .boot p { margin: 0; color: #52636e; }
      .boot g { animation: boot-in .7s cubic-bezier(.2, .8, .2, 1) both; }
      .boot g:nth-child(2) { animation-delay: .16s; } .boot g:nth-child(3) { animation-delay: .32s; } .boot g:nth-child(4) { animation-delay: .48s; }
      @keyframes boot-in { from { transform: translateY(18px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .boot g { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <svg width="130" height="50" viewBox="0 0 260 100" fill="currentColor" role="img" aria-label="Iris" style="overflow: visible">
          <g><circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="9"/><path fill-rule="evenodd" d="M 26 50 A 24 24 0 1 0 74 50 A 24 24 0 1 0 26 50 Z M 60 50 L 55 58.66 L 45 58.66 L 40 50 L 45 41.34 L 55 41.34 Z"/></g>
          <g fill="none" stroke="currentColor" stroke-width="14"><path d="M 128 8 L 128 92"/></g>
          <g fill="none" stroke="currentColor" stroke-width="14"><path d="M 156 92 L 156 40 M 156 62 C 156 48 166 40 182 40"/></g>
          <g><path d="M 200 40 L 200 92" fill="none" stroke="currentColor" stroke-width="14"/><circle cx="200" cy="17" r="8"/><path d="M 250 48 C 246 42 239 40 232 40 C 222 40 216 45 216 52 C 216 60 224 63 232 66 C 241 69 248 72 248 80 C 248 88 241 92 232 92 C 224 92 217 89 214 84" fill="none" stroke="currentColor" stroke-width="12"/></g>
        </svg>
        <p>Starting Iris…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
