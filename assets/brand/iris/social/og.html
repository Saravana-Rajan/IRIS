<!doctype html>
<!-- The link preview (og:image, twitter:image): render at 1200x630, device scale 1, after fonts load, to
     web/public/brand/og.png (headless Chromium, e.g. Playwright page.screenshot). The glass still is the hero's
     web/public/hero/aperture.webp; the mark is the Aperture (web/src/Brand.tsx). -->
<html lang="en"><head><meta charset="utf-8">
<title>Iris link preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root { --ink: #1a1a1a; --muted: #5e5e66; --accent: #b07af2; --pink: #ff5cd6; --accent-ink: #b0269a;
    --holo: linear-gradient(120deg, #8f9bff 0%, #b07af2 40%, #ff5cd6 75%, #7dd3fc 100%); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; background: #fff; }
  body { font-family: "IBM Plex Sans", system-ui, sans-serif; color: var(--ink); position: relative; overflow: hidden; }
  .glow { position: absolute; border-radius: 50%; filter: blur(70px); }
  .g1 { width: 560px; height: 560px; right: -60px; top: 20px; background: radial-gradient(circle, rgba(255,92,214,.22), rgba(176,122,242,.16) 45%, transparent 70%); }
  .g2 { width: 420px; height: 420px; right: 260px; bottom: -220px; background: radial-gradient(circle, rgba(143,155,255,.16), transparent 70%); }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: var(--holo); }
  .text { position: absolute; left: 84px; top: 0; bottom: 8px; width: 640px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand svg { width: 92px; height: 92px; }
  h1 { font-size: 132px; font-weight: 600; letter-spacing: -4px; line-height: 1; }
  .tag { margin-top: 34px; font-size: 44px; line-height: 1.16; font-weight: 500; letter-spacing: -.6px; }
  .tag span { display: block; }
  .tag .hl { background: linear-gradient(100deg, #b0269a, #8a4fe0); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .by { margin-top: 38px; display: inline-flex; align-items: center; gap: 10px; font-size: 24px; color: var(--muted); }
  .by b { color: var(--ink); font-weight: 600; }
  .by i { width: 10px; height: 10px; border-radius: 50%; background: var(--holo); display: inline-block; }
  .art { mix-blend-mode: multiply; position: absolute; right: 56px; top: 42px; height: 546px; }
</style></head>
